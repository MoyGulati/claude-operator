name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets this be re-run on demand. Without it the only way to get a verdict is a
  # new commit, and GitHub refuses to retry a run more than a month old — so a
  # stale red on a dormant repo becomes unclearable without touching code.
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # A missing timeout-minutes defaults to 360. This account has already been
    # billed 361 minutes once for exactly that omission, on a job that normally
    # takes ~2 minutes.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build server (TypeScript)
        run: pnpm --filter claude-operator build:ts

      - name: Build dashboard
        run: pnpm --filter claude-operator-dashboard build

      - name: Bundle dashboard into server package
        run: rm -rf packages/server/dist/dashboard && cp -r packages/dashboard/dist packages/server/dist/dashboard

      - name: Server postbuild (shebang + chmod)
        run: pnpm --filter claude-operator build:postbuild

      - name: Build CLI
        run: pnpm --filter claude-operator-cli build

      - name: Test
        run: pnpm --filter claude-operator test
